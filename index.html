<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>IKO 剧本空位</title>
<style>
:root{--bg:#f6f7f8;--card:rgba(255,255,255,.93);--text:#20242a;--muted:#727985;--line:#e4e7eb;--dark:#22262d;--free:#e9f6ef;--freeText:#246044}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}
body:before{content:"";position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(246,247,248,.80),rgba(246,247,248,.91)),url("./images/iko-dm-bg.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;transform:translateZ(0);pointer-events:none}
.shell{position:relative;z-index:1;width:min(980px,calc(100% - 28px));margin:0 auto;padding:34px 0 70px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.hero h1{font-size:34px;margin:0 0 7px;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);font-size:14px}.badge{font-size:12px;color:#476052;background:rgba(237,245,240,.92);border:1px solid #dcebe2;border-radius:999px;padding:7px 10px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:20px 0 10px}.toolbar input{width:100%;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.95);border-radius:11px;padding:12px 14px;font-size:16px;outline:none}.toolbar input:focus{border-color:#9aa0aa;box-shadow:0 0 0 3px rgba(60,65,75,.08)}.btn{border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700}.btn:hover{background:#f3f4f5}.btn:disabled{opacity:.55;cursor:default}.switch{display:flex;gap:6px;margin:10px 0 14px}.switch .btn{padding:8px 14px}.switch .btn.active{background:var(--dark);border-color:var(--dark);color:#fff}.status{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:10px}.date-group{margin:18px 0}.date-head{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}.date-head h2{font-size:19px;margin:0}.date-head span{font-size:12px;color:var(--muted)}.event{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin:8px 0;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.event-top{display:flex;align-items:center;gap:10px;justify-content:space-between}.event-title{font-weight:850;font-size:16px}.time{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;color:#555c66}.free{margin-top:9px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}.free-label{font-size:12px;color:var(--muted);margin-right:1px}.role{background:var(--free);color:var(--freeText);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}.unknown{font-size:12px;color:#7a6541;background:#fff4d8;border-radius:999px;padding:5px 8px}.empty{background:rgba(255,255,255,.92);border:1px dashed #cfd3d9;border-radius:13px;padding:28px;text-align:center;color:var(--muted);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.cal-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0 10px}.cal-title{font-size:19px;font-weight:850}.cal-actions{display:flex;gap:6px}.calendar{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.94);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{padding:8px 3px;text-align:center;background:rgba(247,248,250,.96);border-bottom:1px solid var(--line);font-size:11px;font-weight:800;color:#69707b}.day{min-width:0;min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.77);text-align:left;overflow:hidden;cursor:pointer}.day:nth-child(7n){border-right:0}.day.other{background:rgba(250,251,252,.7);color:#b5b9c0}.day.today{box-shadow:inset 0 0 0 2px #333}.date-num{font-size:11px;font-weight:850;margin-bottom:4px}.cal-event{display:block;width:100%;border:0;background:#edf6f1;color:#265b46;border-radius:6px;padding:4px 5px;margin:3px 0;font-size:10px;line-height:1.25;text-align:left;white-space:normal;overflow:hidden}.more{font-size:10px;color:var(--muted);padding:2px}.modal-backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.modal h2{margin:0 0 12px;font-size:20px}.modal .event{background:#fafbfc}.modal-actions{display:flex;justify-content:flex-end;margin-top:14px}.foot{margin-top:18px;font-size:11px;color:#8a9099;text-align:center}
@media(max-width:640px){body:before{background-position:center top}.shell{width:min(100% - 20px,980px);padding-top:24px}.hero h1{font-size:28px}.toolbar{grid-template-columns:1fr auto}.event-top{align-items:flex-start}.day{min-height:84px;padding:4px}.weekday{font-size:10px;padding:6px 1px}.date-num{font-size:10px}.cal-event{font-size:9px;padding:3px 4px;margin:2px 0}.cal-title{font-size:16px}.badge{display:none}}

.full-toggle{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 11px;border:1px solid var(--line);
  background:rgba(255,255,255,.95);border-radius:10px;
  font-size:13px;font-weight:700;color:var(--text);
  cursor:pointer;user-select:none;
}
.full-toggle input{width:16px;height:16px;margin:0;accent-color:var(--dark)}
.full-tag{font-size:12px;color:#727985;font-weight:800;background:#eef0f2;border-radius:999px;padding:5px 8px}
@media(max-width:560px){.switch{flex-wrap:wrap}.full-toggle{margin-left:0}}


/* v3.0.5：满车统一红色显示 */
.event.is-full{
  background:rgba(255,239,239,.96);
  border-color:#efb7b7;
  box-shadow:0 8px 22px rgba(190,55,55,.06);
}
.event.is-full .event-title{color:#9f2f2f}
.event.is-full .time{color:#b33a3a}
.full-tag{
  color:#a72d2d !important;
  background:#ffe2e2 !important;
  border:1px solid #efb0b0;
}
.cal-event.is-full{
  background:#ffe2e2;
  color:#9f2f2f;
  border:1px solid #efb0b0;
}
.cal-event.is-full b{color:#9f2f2f}

</style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div><h1>IKO 剧本空位</h1><p>仅显示开放日期、时间、剧本名和目前空着的玩家角色。</p></div>
    <div class="badge">只读公开页 · 不含 Staff 信息</div>
  </header>
  <div class="toolbar"><input id="search" autocomplete="off" placeholder="搜索日期 / 剧本 / 空角色"><button class="btn" id="refresh" type="button">刷新</button></div>
  <div class="switch"><button class="btn active" id="listBtn" type="button">列表</button><button class="btn" id="calendarBtn" type="button">日历</button><label class="full-toggle"><input type="checkbox" id="showFullCars"><span>显示满车</span></label></div>
  <div id="status" class="status">正在读取最新排期…</div>
  <section id="content"></section>
  <div class="foot">页面仅供查看，以店内最新安排为准。</div>
</main>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true"><div class="modal"><div id="modalBody"></div><div class="modal-actions"><button class="btn" id="modalClose" type="button">关闭</button></div></div></div>
<script>
(() => {
  'use strict';
  const API_URL='https://script.google.com/macros/s/AKfycbx5fqcNSao0hWQRQAio8m2NGStzwOUiZaw-Vdoqrh8WAegQqnkazy_kodLsBvYRqrYH/exec';
  const $=s=>document.querySelector(s);
  let data={events:[]},view='list',calendarCursor='',showFullCars=false;
  const pad=n=>String(n).padStart(2,'0');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s??'').toLowerCase().replace(/\s+/g,'');
  function dateParts(date){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date||''));return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
  function weekday(date){const p=dateParts(date);if(!p)return'';return['日','一','二','三','四','五','六'][new Date(p.y,p.m-1,p.d,12).getDay()]}
  function dateText(date){const p=dateParts(date);return p?`${p.m}月${p.d}日`:date}
  function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
  function timeText(e){return e.endTime?`${e.time||''}–${e.endTime}`:(e.time||'')}
  function filtered(){
    const q=norm($('#search').value);
    return (data.events||[]).filter(e=>{
      if(e.isFull && !showFullCars) return false;
      return !q||norm([e.date,dateText(e.date),'周'+weekday(e.date),e.time,e.endTime,e.title,(e.freeRoles||[]).join(' '),e.isFull?'已满':''].join(' ')).includes(q);
    });
  }
  function render(){ $('#listBtn').classList.toggle('active',view==='list');$('#calendarBtn').classList.toggle('active',view==='calendar'); view==='calendar'?renderCalendar():renderList(); }
  function renderList(){
    const rows=filtered();
    if(!rows.length){$('#content').innerHTML='<div class="empty">没有找到开放车次</div>';return}
    const groups={};rows.forEach(e=>(groups[e.date]||(groups[e.date]=[])).push(e));
    $('#content').innerHTML=Object.keys(groups).sort().map(date=>`<div class="date-group"><div class="date-head"><h2>${esc(dateText(date))}（周${weekday(date)}）</h2><span>${groups[date].length} 车</span></div>${groups[date].sort((a,b)=>String(a.time).localeCompare(String(b.time))).map(eventHtml).join('')}</div>`).join('');
  }
  function eventHtml(e){
    const roles=e.freeRoles||[];
    const free=e.isFull
      ? '<span class="full-tag">已满</span>'
      : (e.roleInfoKnown===false
          ? '<span class="unknown">空位信息待确认</span>'
          : `<span class="free-label">缺：</span>${roles.map(r=>`<span class="role">${esc(r)}</span>`).join('')}`);
    return `<article class="event ${e.isFull?'is-full':''}"><div class="event-top"><div class="event-title">《${esc(e.title||'-')}》</div><div class="time">${esc(timeText(e))}</div></div><div class="free">${free}</div></article>`;
  }
  function baseMonth(){
    if(/^\d{4}-\d{2}$/.test(calendarCursor))return calendarCursor;
    const rows=filtered(),today=todayStr(),tm=today.slice(0,7);
    if(rows.some(x=>String(x.date||'').startsWith(tm)))return tm;
    const future=rows.find(x=>String(x.date||'')>=today);
    return String((future||rows[0]||{date:today}).date).slice(0,7);
  }
  function shiftMonth(delta){const [y,m]=baseMonth().split('-').map(Number);const d=new Date(y,m-1+delta,1);calendarCursor=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderCalendar()}
  function renderCalendar(){
    const rows=filtered();calendarCursor=baseMonth();
    const [y,m]=calendarCursor.split('-').map(Number),first=new Date(y,m-1,1),start=(first.getDay()+6)%7,dim=new Date(y,m,0).getDate(),prevDim=new Date(y,m-1,0).getDate();
    const byDate={};rows.forEach(e=>(byDate[e.date]||(byDate[e.date]=[])).push(e));Object.values(byDate).forEach(a=>a.sort((x,z)=>String(x.time).localeCompare(String(z.time))));
    let cells='';
    for(let i=0;i<42;i++){
      let yy=y,mm=m,dd=i-start+1,other=false;
      if(dd<1){other=true;mm=m-1;if(mm<1){mm=12;yy--}dd=prevDim+dd}else if(dd>dim){other=true;dd-=dim;mm=m+1;if(mm>12){mm=1;yy++}}
      const date=`${yy}-${pad(mm)}-${pad(dd)}`,ev=byDate[date]||[];
      cells+=`<div class="day ${other?'other':''} ${date===todayStr()?'today':''}" data-date="${date}"><div class="date-num">${dd}${ev.length?` · ${ev.length}车`:''}</div>${ev.slice(0,2).map(x=>`<button class="cal-event ${x.isFull?'is-full':''}" type="button" data-date="${date}"><b>${esc(x.time)}</b> ${esc(x.title)}${x.isFull?' · 已满':''}</button>`).join('')}${ev.length>2?`<div class="more">＋${ev.length-2}</div>`:''}</div>`;
    }
    $('#content').innerHTML=`<div class="cal-tools"><div class="cal-actions"><button class="btn" id="prev">←</button><button class="btn" id="today">今天</button></div><div class="cal-title">${y}年 ${m}月</div><div class="cal-actions"><button class="btn" id="next">→</button></div></div><div class="calendar"><div class="cal-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">周${x}</div>`).join('')}${cells}</div></div>`;
    $('#prev').onclick=()=>shiftMonth(-1);$('#next').onclick=()=>shiftMonth(1);$('#today').onclick=()=>{calendarCursor=todayStr().slice(0,7);renderCalendar()};
    document.querySelectorAll('.day').forEach(x=>x.onclick=e=>{if(e.target.closest('.cal-event'))return;openDay(x.dataset.date)});
    document.querySelectorAll('.cal-event').forEach(x=>x.onclick=e=>{e.stopPropagation();openDay(x.dataset.date)});
  }
  function openDay(date){
    const rows=filtered().filter(x=>x.date===date).sort((a,b)=>String(a.time).localeCompare(String(b.time)));
    $('#modalBody').innerHTML=`<h2>${esc(dateText(date))}（周${weekday(date)}）</h2>${rows.length?rows.map(eventHtml).join(''):'<div class="empty">当天没有开放车次</div>'}`;
    $('#modalBackdrop').classList.add('show');document.body.style.overflow='hidden';
  }
  function closeModal(){$('#modalBackdrop').classList.remove('show');document.body.style.overflow=''}
  function load(timeoutMs=26000){
    return new Promise((resolve,reject)=>{
      const cb='iko_'+Date.now().toString(36)+'_'+Math.floor(Math.random()*1e6).toString(36);let done=false;
      const tag=document.createElement('script');const timer=setTimeout(()=>finish(new Error('读取超时，请重试')),timeoutMs);
      function finish(err,payload){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){};tag.remove();err?reject(err):resolve(payload)}
      window[cb]=payload=>finish(null,payload);tag.onerror=()=>finish(new Error('无法连接排期后台'));
      tag.src=API_URL+'?api=public&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(tag);
    });
  }
  async function refresh(){
    const b=$('#refresh');b.disabled=true;$('#status').textContent='正在读取最新排期…';
    try{
      let p;try{p=await load()}catch(first){$('#status').textContent='后台首次连接较慢，正在自动重试…';await new Promise(r=>setTimeout(r,900));p=await load()}
      if(!p||p.ok===false)throw new Error(p?.error||'读取失败');
      data={events:Array.isArray(p.events)?p.events:[]};
      $('#status').textContent=`已更新 · ${filtered().length} 个可见车次`;
      calendarCursor='';render();
    }catch(e){$('#status').textContent=e.message||'读取失败';$('#content').innerHTML='<div class="empty">暂时无法读取排期，请点击“刷新”重试。</div>'}
    finally{b.disabled=false}
  }
  try{showFullCars=localStorage.getItem('iko_show_full_cars')==='1'}catch(e){}
  if($('#showFullCars')){
    $('#showFullCars').checked=showFullCars;
    $('#showFullCars').onchange=()=>{
      showFullCars=$('#showFullCars').checked;
      try{localStorage.setItem('iko_show_full_cars',showFullCars?'1':'0')}catch(e){}
      calendarCursor='';
      render();
      $('#status').textContent=`已更新 · ${filtered().length} 个可见车次`;
    };
  }
  $('#search').addEventListener('input',()=>{calendarCursor='';render()});$('#refresh').onclick=refresh;$('#listBtn').onclick=()=>{view='list';render()};$('#calendarBtn').onclick=()=>{view='calendar';render()};$('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});refresh();
})();
</script>
</body>
</html>
