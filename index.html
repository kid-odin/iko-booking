<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>IKO 剧本空位</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#20242a;--muted:#727985;--line:#e4e7eb;--dark:#22262d;--free:#e9f6ef;--freeText:#246044;--accent:#252930}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.shell{position:relative;z-index:2;width:min(980px,calc(100% - 28px));margin:0 auto;padding:34px 0 70px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.hero h1{font-size:34px;margin:0 0 7px;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);font-size:14px}.badge{font-size:12px;color:#476052;background:#edf5f0;border:1px solid #dcebe2;border-radius:999px;padding:7px 10px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:20px 0 10px}.toolbar input{width:100%;min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 14px;font-size:16px;outline:none}.toolbar input:focus{border-color:#9aa0aa;box-shadow:0 0 0 3px rgba(60,65,75,.08)}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700}.btn:hover{background:#f3f4f5}.switch{display:flex;gap:6px;margin:10px 0 14px}.switch .btn{padding:8px 14px}.switch .btn.active{background:var(--dark);border-color:var(--dark);color:#fff}.status{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:10px}.date-group{margin:18px 0}.date-head{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}.date-head h2{font-size:19px;margin:0}.date-head span{font-size:12px;color:var(--muted)}.event{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin:8px 0}.event-top{display:flex;align-items:center;gap:10px;justify-content:space-between}.event-title{font-weight:850;font-size:16px}.time{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}.free{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}.role{background:var(--free);color:var(--freeText);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}.full{font-size:12px;color:#8a5b5b;background:#f8eded;border-radius:999px;padding:5px 8px}.empty{background:#fff;border:1px dashed #cfd3d9;border-radius:13px;padding:28px;text-align:center;color:var(--muted)}.cal-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0 10px}.cal-title{font-size:19px;font-weight:850}.cal-actions{display:flex;gap:6px}.calendar{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{padding:8px 3px;text-align:center;background:#f7f8fa;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;color:#69707b}.day{min-width:0;min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;text-align:left;overflow:hidden}.day:nth-child(7n){border-right:0}.day.other{background:#fafbfc;color:#b5b9c0}.day.today{box-shadow:inset 0 0 0 2px #333}.date-num{font-size:11px;font-weight:850;margin-bottom:4px}.cal-event{display:block;width:100%;border:0;background:#edf6f1;color:#265b46;border-radius:6px;padding:4px 5px;margin:3px 0;font-size:10px;line-height:1.25;text-align:left;white-space:normal;overflow:hidden}.more{font-size:10px;color:var(--muted);padding:2px}.modal-backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.modal h2{margin:0 0 12px;font-size:20px}.modal .event{background:#fafbfc}.modal-actions{display:flex;justify-content:flex-end;margin-top:14px}.bg-dms{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.bg-dm{position:absolute;border-radius:20px;overflow:hidden;opacity:.16;filter:saturate(.94);animation:floaty var(--dm-speed,18s) ease-in-out infinite alternate;box-shadow:0 12px 35px rgba(0,0,0,.10);will-change:transform}.bg-dm img{width:100%;height:100%;object-fit:cover}.foot{margin-top:18px;font-size:11px;color:#8a9099;text-align:center}@keyframes floaty{0%{transform:translate3d(-10px,-18px,0) rotate(-4deg)}35%{transform:translate3d(26px,6px,0) rotate(2deg)}70%{transform:translate3d(-16px,34px,0) rotate(-1deg)}100%{transform:translate3d(34px,48px,0) rotate(5deg)}}
@media(max-width:640px){.shell{width:min(100% - 20px,980px);padding-top:24px}.hero h1{font-size:28px}.toolbar{grid-template-columns:1fr auto}.event-top{align-items:flex-start}.day{min-height:84px;padding:4px}.weekday{font-size:10px;padding:6px 1px}.date-num{font-size:10px}.cal-event{font-size:9px;padding:3px 4px;margin:2px 0}.cal-title{font-size:16px}.badge{display:none}}
@media(prefers-reduced-motion:reduce){.bg-dm{animation:none}}
</style>

<main class="shell">

</main>

  const $=s=>document.querySelector(s);
  let data={events:[],photos:[]},view='list',calendarCursor='';
  const pad=n=>String(n).padStart(2,'0');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s??'').toLowerCase().replace(/\s+/g,'');
  function dateParts(date){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date||''));return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
  function weekday(date){const p=dateParts(date);if(!p)return'';return['日','一','二','三','四','五','六'][new Date(p.y,p.m-1,p.d).getDay()]}
  function dateText(date){const p=dateParts(date);return p?`${p.m}月${p.d}日`:date}
  function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
  function filtered(){const q=norm($('#search').value);return (data.events||[]).filter(e=>!q||norm([e.date,e.time,e.title,(e.freeRoles||[]).join(' ')].join(' ')).includes(q))}
  function render(){ $('#listBtn').classList.toggle('active',view==='list');$('#calendarBtn').classList.toggle('active',view==='calendar'); view==='calendar'?renderCalendar():renderList(); }
  function renderList(){const rows=filtered();if(!rows.length){$('#content').innerHTML='<div class="empty">没有找到开放车次</div>';return}const groups={};rows.forEach(e=>(groups[e.date]||(groups[e.date]=[])).push(e));$('#content').innerHTML=Object.keys(groups).sort().map(date=>`<div class="date-group"><div class="date-head"><h2>${esc(dateText(date))}（周${weekday(date)}）</h2><span>${groups[date].length} 车</span></div>${groups[date].sort((a,b)=>String(a.time).localeCompare(String(b.time))).map(eventHtml).join('')}</div>`).join('')}
  function eventHtml(e){const roles=(e.freeRoles||[]);return `<article class="event"><div class="event-top"><div class="event-title">《${esc(e.title||'-')}》</div><div class="time">${esc(e.time||'')}</div></div><div class="free">${roles.length?roles.map(r=>`<span class="role">${esc(r)}</span>`).join(''):'<span class="full">目前已满</span>'}</div></article>`}
  function baseMonth(){if(/^\d{4}-\d{2}$/.test(calendarCursor))return calendarCursor;const rows=filtered();const first=rows[0]?.date||todayStr();return first.slice(0,7)}
  function shiftMonth(delta){const [y,m]=baseMonth().split('-').map(Number);const d=new Date(y,m-1+delta,1);calendarCursor=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderCalendar()}
  function renderCalendar(){const rows=filtered();calendarCursor=baseMonth();const [y,m]=calendarCursor.split('-').map(Number);const first=new Date(y,m-1,1);const start=(first.getDay()+6)%7;const dim=new Date(y,m,0).getDate();const prevDim=new Date(y,m-1,0).getDate();let cells='';for(let i=0;i<42;i++){let yy=y,mm=m,dd=i-start+1,other=false;if(dd<1){other=true;mm=m-1;if(mm<1){mm=12;yy--}dd=prevDim+dd}else if(dd>dim){other=true;dd-=dim;mm=m+1;if(mm>12){mm=1;yy++}}const date=`${yy}-${pad(mm)}-${pad(dd)}`;const ev=rows.filter(x=>x.date===date).sort((a,b)=>String(a.time).localeCompare(String(b.time)));cells+=`<div class="day ${other?'other':''} ${date===todayStr()?'today':''}" data-date="${date}"><div class="date-num">${dd}${ev.length?` · ${ev.length}车`:''}</div>${ev.slice(0,2).map(x=>`<button class="cal-event" type="button" data-date="${date}"><b>${esc(x.time)}</b> ${esc(x.title)}</button>`).join('')}${ev.length>2?`<div class="more">＋${ev.length-2}</div>`:''}</div>`}$('#content').innerHTML=`<div class="cal-tools"><div class="cal-actions"><button class="btn" id="prev" type="button">←</button><button class="btn" id="today" type="button">今天</button></div><div class="cal-title">${y}年 ${m}月</div><div class="cal-actions"><button class="btn" id="next" type="button">→</button></div></div><div class="calendar"><div class="cal-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">周${x}</div>`).join('')}${cells}</div></div>`;$('#prev').onclick=()=>shiftMonth(-1);$('#next').onclick=()=>shiftMonth(1);$('#today').onclick=()=>{calendarCursor=todayStr().slice(0,7);renderCalendar()};document.querySelectorAll('.day').forEach(el=>el.addEventListener('click',ev=>{if(ev.target.closest('.cal-event'))return;openDay(el.dataset.date)}));document.querySelectorAll('.cal-event').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();openDay(el.dataset.date)}))}
  function openDay(date){const rows=filtered().filter(e=>e.date===date).sort((a,b)=>String(a.time).localeCompare(String(b.time)));$('#modalBody').innerHTML=`<h2 id="modalTitle">${esc(dateText(date))}（周${weekday(date)}）</h2>${rows.length?rows.map(eventHtml).join(''):'<div class="empty">当天没有开放车次</div>'}`;$('#modalBackdrop').classList.add('show')}
  function closeModal(){ $('#modalBackdrop').classList.remove('show') }
  function renderPhotos(){const remote=(data.photos||[]).filter(u=>/^https?:\/\//i.test(u));const sources=[...EMBEDDED_DM_PHOTOS,...remote.filter(u=>!EMBEDDED_DM_PHOTOS.includes(u))];const root=$('#bgDMs');if(!sources.length){root.innerHTML='';return}const count=window.matchMedia('(max-width:640px)').matches?12:18;const urls=Array.from({length:count},(_,i)=>sources[i%sources.length]);root.innerHTML=urls.map((u,i)=>{const size=86+(i%5)*14;const left=(i*23+5)%94;const top=(i*17+(i%3)*11)%88;const speed=13+(i%7)*1.4;const delay=(i*2.1)%14;return `<div class="bg-dm" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;--dm-speed:${speed.toFixed(1)}s;animation-delay:-${delay.toFixed(1)}s"><img src="${esc(u)}" alt=""></div>`}).join('')}
  function load(){return new Promise((resolve,reject)=>{const cb='__ikoGuest_'+Date.now()+'_'+Math.floor(Math.random()*1e6);let done=false;const tag=document.createElement('script');const timer=setTimeout(()=>finish(new Error('读取超时，请重试')),12000);function finish(err,payload){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){};tag.remove();err?reject(err):resolve(payload)}window[cb]=payload=>finish(null,payload);tag.onerror=()=>finish(new Error('无法连接排期后台'));tag.src=API_URL+'?api=public&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(tag)})}
  async function refresh(){const b=$('#refresh');b.disabled=true;$('#status').textContent='正在读取最新排期…';try{const p=await load();if(!p||p.ok===false)throw new Error(p?.error||'读取失败');data={events:Array.isArray(p.events)?p.events:[],photos:Array.isArray(p.photos)?p.photos:[]};$('#status').textContent=`已更新 · ${data.events.length} 个开放车次`;calendarCursor='';renderPhotos();render()}catch(e){$('#status').textContent=e.message||'读取失败';$('#content').innerHTML='<div class="empty">暂时无法读取排期，请点击“刷新”重试。</div>'}finally{b.disabled=false}}
  $('#search').addEventListener('input',()=>{calendarCursor='';render()});$('#refresh').onclick=refresh;$('#listBtn').onclick=()=>{view='list';render()};$('#calendarBtn').onclick=()=>{view='calendar';render()};$('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});refresh();
